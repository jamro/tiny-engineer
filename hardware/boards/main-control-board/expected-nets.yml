# Critical net → pin memberships for review.
# Tokens = KiCad netlist RefDes.PinNum:PinName (pin number + symbol pin name).
# Compare with: kicad-cli sch export netlist
# See docs/pcb.md#expected-netsyml

nets:
  "+5V":
    - C2.1:1
    - J7.1:Pin_1
    - R11.1:1
    - U2.2:2
    - U2.5:5
    - U2.8:8
    - U2.11:11
    - U2.14:14
    - USB1.A4B9:VBUS
    - USB1.B4A9:VBUS
  "+3.3V":
    - C1.2:2
    - J2.1:Pin_1
    - J7.3:Pin_3
    - R3.1:1
    - R4.1:1
    - R5.1:1
    - U1.28:VDD
  GND:
    - C1.1:1
    - C2.2:2
    - D1.1:K
    - J2.2:Pin_2
    - J7.2:Pin_2
    - R1.1:1
    - R2.1:1
    - U1.1:A0
    - U1.2:A1
    - U1.3:A2
    - U1.4:A3
    - U1.5:A4
    - U1.14:VSS
    - U1.24:A5
    - U1.25:EXTCLK
    - U2.1:1
    - U2.4:4
    - U2.7:7
    - U2.10:10
    - U2.13:13
    - USB1.13:EH
    - USB1.14:EH
    - USB1.A1B12:GND
    - USB1.B1A12:GND
  "/I2C_SDA":
    - J2.3:Pin_3
    - J7.4:Pin_4
    - R5.2:2
    - U1.27:SDA
  "/I2C_SCL":
    - J2.4:Pin_4
    - J7.5:Pin_5
    - R4.2:2
    - U1.26:SCL
  "/ESP32/GP5":
    - J7.9:Pin_9
    - R3.2:2
    - U1.23:~{OE}
  "/I2S_BCLK":
    - J7.6:Pin_6
  "/I2S_LRC":
    - J7.7:Pin_7
  "/I2S_DIN":
