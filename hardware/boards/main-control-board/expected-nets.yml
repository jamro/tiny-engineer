# Critical net → pin memberships for review.
# Tokens = KiCad netlist RefDes.PinNum:PinName (pin number + symbol pin name).
# Compare with: kicad-cli sch export netlist
# See docs/pcb.md#expected-netsyml

nets:
  "+5V":
    - ESP1.1:5V
    - J1.7:Pin_7
    - PCA1.6:V+
    - USB1.3:Pin_3
  "+3.3V":
    - ESP1.3:3V3
    - J2.1:Pin_1
    - PCA1.5:VCC
  GND:
    - ESP1.2:GND
    - J1.6:Pin_6
    - J2.2:Pin_2
    - PCA1.1:GND
    - USB1.4:Pin_4
  "/I2C_SDA":
    - ESP1.4:GP0
    - J2.3:Pin_3
    - PCA1.4:SDA
  "/I2C_SCL":
    - ESP1.5:GP1
    - J2.4:Pin_4
    - PCA1.3:SCL
  "/I2S_BCLK":
    - ESP1.6:GP2
    - J1.2:Pin_2
  "/I2S_LRC":
    - ESP1.7:GP3
    - J1.1:Pin_1
  "/I2S_DIN":
    - ESP1.8:GP4
    - J1.3:Pin_3
  "Net-(ESP1-GP5)":
    - ESP1.9:GP5
    - PCA1.2:OE
  "/USB_D+":
    - ESP1.16:USB_DP
    - USB1.1:Pin_1
  "/USB_D-":
    - ESP1.15:USB_DM
    - USB1.2:Pin_2
