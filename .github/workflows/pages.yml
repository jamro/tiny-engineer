name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_flash_catalog.py"
      - "scripts/assembly/**"
      - "3d_models/cad/**"
      - "3d_models/parts/sg90/stl/**"
      - "mods/*/3d_models/**"
      - ".github/workflows/pages.yml"
  # Fork only: deploy pull requests to this fork's GitHub Pages as a preview.
  # Remove this pull_request trigger (and the fork-preview-guard job below)
  # before this is merged into upstream main (jamro/tiny-engineer).
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_flash_catalog.py"
      - "scripts/assembly/**"
      - "3d_models/cad/**"
      - "3d_models/parts/sg90/stl/**"
      - "mods/*/3d_models/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Fails every pull request run on purpose, so a PR that still carries the
  # fork's preview trigger shows a red check and is not merged upstream by
  # accident. The deploy job does not depend on it: the preview still builds
  # and deploys. Remove together with the pull_request trigger above.
  fork-preview-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fail on purpose (fork preview trigger still present)
        run: |
          echo "::error file=.github/workflows/pages.yml::Pages runs on pull requests for fork previews. Remove the pull_request trigger and this job before merging into upstream main."
          exit 1

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build flash release catalog
        run: python3 scripts/build_flash_catalog.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/assembly/requirements.txt
      - name: Build 3D assembly model
        run: |
          pip install -r scripts/assembly/requirements.txt
          scripts/assembly/build.sh web/assembly/models
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
