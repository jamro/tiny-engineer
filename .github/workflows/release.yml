name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build firmware
        run: pio run
      - name: Build LittleFS image
        run: pio run -t buildfs
      - name: Stage release binaries
        run: |
          mkdir -p dist
          cp .pio/build/esp32-c3-devkitm-1/bootloader.bin \
            "dist/tiny-engineer-${GITHUB_REF_NAME}-bootloader.bin"
          cp .pio/build/esp32-c3-devkitm-1/partitions.bin \
            "dist/tiny-engineer-${GITHUB_REF_NAME}-partitions.bin"
          cp .pio/build/esp32-c3-devkitm-1/firmware.bin \
            "dist/tiny-engineer-${GITHUB_REF_NAME}-firmware.bin"
          cp .pio/build/esp32-c3-devkitm-1/littlefs.bin \
            "dist/tiny-engineer-${GITHUB_REF_NAME}-littlefs.bin"
      - name: Write ESP Web Tools manifest
        run: |
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/jamro/tiny-engineer/releases/download/{tag}"
          version = tag[1:] if tag.startswith("v") else tag

          def parse_offset(raw: str) -> int:
              raw = raw.strip()
              return int(raw, 16) if raw.lower().startswith("0x") else int(raw)

          app_off = None
          fs_off = None
          with Path("partitions.csv").open(newline="", encoding="utf-8") as f:
              for row in csv.reader(f):
                  if not row or row[0].lstrip().startswith("#"):
                      continue
                  name = row[0].strip()
                  if len(row) < 4:
                      continue
                  offset = parse_offset(row[3])
                  subtype = row[2].strip() if len(row) > 2 else ""
                  if name == "app0" or subtype == "ota_0":
                      app_off = offset
                  if name == "spiffs" or subtype == "spiffs":
                      fs_off = offset

          if app_off is None or fs_off is None:
              raise SystemExit(
                  f"partitions.csv missing app0/ota_0 or spiffs (app={app_off}, fs={fs_off})"
              )

          # ESP32-C3 image layout: bootloader @ 0x0, partition table @ 0x8000
          boot_off = 0
          part_off = 0x8000

          manifest = {
              "name": "Tiny Engineer",
              "version": version,
              "new_install_prompt_erase": True,
              "builds": [
                  {
                      "chipFamily": "ESP32-C3",
                      "parts": [
                          {"path": f"{base}/tiny-engineer-{tag}-bootloader.bin", "offset": boot_off},
                          {"path": f"{base}/tiny-engineer-{tag}-partitions.bin", "offset": part_off},
                          {"path": f"{base}/tiny-engineer-{tag}-firmware.bin", "offset": app_off},
                          {"path": f"{base}/tiny-engineer-{tag}-littlefs.bin", "offset": fs_off},
                      ],
                  }
              ],
          }
          with open("dist/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(
              f"manifest offsets: boot=0x{boot_off:x} part=0x{part_off:x} "
              f"app=0x{app_off:x} fs=0x{fs_off:x}"
          )
          PY
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tiny-engineer-${{ github.ref_name }}-bootloader.bin
            dist/tiny-engineer-${{ github.ref_name }}-partitions.bin
            dist/tiny-engineer-${{ github.ref_name }}-firmware.bin
            dist/tiny-engineer-${{ github.ref_name }}-littlefs.bin
            dist/manifest.json
          generate_release_notes: true
          body: |
            ## Flash offsets (default USB layout)

            | File | Offset |
            | --- | --- |
            | `tiny-engineer-${{ github.ref_name }}-bootloader.bin` | `0x0` |
            | `tiny-engineer-${{ github.ref_name }}-partitions.bin` | `0x8000` |
            | `tiny-engineer-${{ github.ref_name }}-firmware.bin` | `0x10000` |
            | `tiny-engineer-${{ github.ref_name }}-littlefs.bin` | `0x220000` |

            All **four** files are required for a clean first flash or web install. App + LittleFS alone is enough only when bootloader and partition table are already on the chip.

            Web flash: [jamro.github.io/tiny-engineer/flash/](https://jamro.github.io/tiny-engineer/flash/) — pick this tag (or any release that ships `manifest.json`). Offsets above match this tag’s `partitions.csv`. Usual path: clone the tagged commit and run `pio run -t upload` (see [docs/flash.md](https://github.com/jamro/tiny-engineer/blob/main/docs/flash.md)).
