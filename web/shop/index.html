<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · Tiny Engineer</title>
  <meta name="description" content="Buy parts for Tiny Engineer before you print or flash.">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500|ibm-plex-sans:400,500,600" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="page-shop">
  <div class="wrap">
    <header class="site-header" data-page="shop" data-root="../"></header>
    <script src="../js/site-header.js"></script>

    <main>
      <div class="build-head">
        <script src="../js/build-progress.js"></script>
        <nav class="build-timeline" data-stage="shop" data-root="../"></nav>
        <script src="../js/build-timeline.js"></script>
        <div class="flash-intro">
          <p class="eyebrow">Parts · cart</p>
          <h1>Shop</h1>
          <p class="lede">
            Buy what you need before you print or connect.
          </p>
        </div>
      </div>

      <section class="panel">
        <p class="panel-label">Shopping list</p>
        <div class="panel-body stage-doc-body">
          <p>
            Servos, board, and the rest of the cart live in the shopping guide.
          </p>
          <p>
            <a class="btn btn-primary" href="https://github.com/jamro/tiny-engineer/blob/main/docs/shopping.md" target="_blank" rel="noopener noreferrer">
              Open shopping instructions
              <svg class="icon" aria-hidden="true"><use href="../media/icons.svg#i-external"></use></svg>
            </a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="mono">List lives in <a href="https://github.com/jamro/tiny-engineer/blob/main/docs/shopping.md">docs/shopping.md</a></p>
    </footer>
  </div>
</body>
</html>
